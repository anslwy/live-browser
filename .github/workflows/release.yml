name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Runs first: creates the release with a PR list since the previous tag,
  # so the three asset jobs below only ever append files (previously each
  # job regenerated GitHub's auto-notes, which listed no PRs and tripled
  # the body).
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes (PRs since previous release)
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -1)"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          if [[ -n "$PREV" ]]; then RANGE="$PREV..$TAG"; else RANGE="$TAG"; fi
          {
            echo "## What's Changed"
            echo
            # One line per commit, oldest first. Squash-merges look like
            # "Title (#12)" — link the PR number.
            git log "$RANGE" --reverse --format='%s' \
              | sed -E "s|\(#([0-9]+)\)|([#\1](${REPO_URL}/pull/\1))|" \
              | sed 's/^/- /'
            echo
            if [[ -n "$PREV" ]]; then
              echo "**Full Changelog**: ${REPO_URL}/compare/${PREV}...${TAG}"
            fi
          } > notes.md
          cat notes.md

      - name: Create release with notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          fi

  linux-x86_64:
    needs: [notes]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        run: |
          cd web
          npm ci
          npm run build

      - name: Build binary
        run: cargo build --release

      - name: Package
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          OUT="live-browser-${TAG}-linux-x86_64"
          mkdir -p "pkg/${OUT}/web"
          cp target/release/lb "pkg/${OUT}/lb"
          cp -r web/dist "pkg/${OUT}/web/dist"
          cp README.md install.sh "pkg/${OUT}/"
          tar -czf "${OUT}.tar.gz" -C pkg "${OUT}"
          echo "ASSET=${OUT}.tar.gz" >> "$GITHUB_ENV"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}

  macos:
    needs: [notes]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (both mac targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        run: |
          cd web
          npm ci
          npm run build

      - name: Build binary (native arm64)
        run: cargo build --release

      - name: Build binary (Intel x86_64, best-effort cross)
        id: intel
        continue-on-error: true
        run: cargo build --release --target x86_64-apple-darwin

      - name: Package
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Native arm64 asset (always).
          OUT="live-browser-${TAG}-darwin-arm64"
          mkdir -p "pkg/${OUT}/web"
          cp target/release/lb "pkg/${OUT}/lb"
          cp -r web/dist "pkg/${OUT}/web/dist"
          cp README.md install.sh "pkg/${OUT}/"
          tar -czf "${OUT}.tar.gz" -C pkg "${OUT}"
          # Intel asset when the cross build succeeded.
          if [[ -f target/x86_64-apple-darwin/release/lb ]]; then
            OUT="live-browser-${TAG}-darwin-x86_64"
            mkdir -p "pkg/${OUT}/web"
            cp target/x86_64-apple-darwin/release/lb "pkg/${OUT}/lb"
            cp -r web/dist "pkg/${OUT}/web/dist"
            cp README.md install.sh "pkg/${OUT}/"
            tar -czf "${OUT}.tar.gz" -C pkg "${OUT}"
          else
            echo "WARNING: Intel cross build unavailable — Intel Macs can install with --from-source"
          fi
          # Newline-separated: softprops/action-gh-release treats each
          # line as one glob (a space-separated string is one pattern
          # and matches nothing).
          {
            echo "ASSETS<<EOF"
            ls live-browser-"${TAG}"-darwin-*.tar.gz
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSETS }}

  windows-x86_64:
    needs: [notes]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        run: |
          cd web
          npm ci
          npm run build

      - name: Build binary
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          $out = "live-browser-$tag-windows-x86_64"
          New-Item -ItemType Directory -Path "pkg/$out/web" -Force | Out-Null
          Copy-Item "target/release/lb.exe" "pkg/$out/lb.exe"
          Copy-Item "web/dist" "pkg/$out/web/dist" -Recurse -Force
          Copy-Item "README.md", "install.ps1" "pkg/$out/"
          Compress-Archive -Path "pkg/$out" -DestinationPath "$out.zip" -Force
          "ASSET=$out.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
