<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Browser</title>
    <link rel="icon" type="image/svg+xml" href="./globe.svg" />
    <script>
      // Embed params (e.g. Vicuna's iframe), applied before first paint:
      // ?theme=light|dark selects the theme; ?accent=rrggbb + ?accentfg=rrggbb
      // re-tint --accent/--accent-fg and the --live indicators. Invalid
      // values are ignored (saved theme, built-in accents). Defaults to dark.
      try {
        var qs = new URLSearchParams(window.location.search);
        var q = qs.get('theme');
        document.documentElement.dataset.theme =
          q === 'light' || q === 'dark' ? q : localStorage.getItem('lb-theme') || 'dark';
        var hex = /^[0-9a-fA-F]{6}$/;
        var acc = qs.get('accent');
        if (acc !== null && hex.test(acc)) {
          document.documentElement.style.setProperty('--accent', '#' + acc);
          document.documentElement.style.setProperty('--live', '#' + acc);
        }
        var fg = qs.get('accentfg');
        if (fg !== null && hex.test(fg)) {
          document.documentElement.style.setProperty('--accent-fg', '#' + fg);
        }
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
