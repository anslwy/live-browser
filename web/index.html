<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Browser</title>
    <link rel="icon" type="image/svg+xml" href="./globe.svg" />
    <script>
      // Apply theme before first paint (no flash): explicit ?theme= embed
      // param (e.g. Vicuna's iframe) wins, then the saved setting.
      // Defaults to dark.
      try {
        var q = new URLSearchParams(window.location.search).get('theme');
        document.documentElement.dataset.theme =
          q === 'light' || q === 'dark' ? q : localStorage.getItem('lb-theme') || 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
