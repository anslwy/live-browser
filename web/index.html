<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Kurisu · Live Browser</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <script>
      // Embed params (e.g. Vicuna's iframe), applied before first paint:
      // ?theme=light|dark selects the theme; ?accent=rrggbb + ?accentfg=rrggbb
      // re-tint --accent/--accent-fg and the --live indicators. Invalid
      // values are ignored (saved theme, built-in accents). With no choice
      // made, follow the system preference like the Kurisu web app does.
      try {
        var qs = new URLSearchParams(window.location.search);
        var q = qs.get('theme');
        var saved = localStorage.getItem('lb-theme');
        var system = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        var theme = q === 'light' || q === 'dark' ? q : saved === 'light' || saved === 'dark' ? saved : system;
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]') || document.head.appendChild(document.createElement('meta'));
        meta.setAttribute('name', 'theme-color');
        meta.setAttribute('content', theme === 'light' ? '#fffaf6' : '#240c0e');
        var hex = /^[0-9a-fA-F]{6}$/;
        var acc = qs.get('accent');
        if (acc !== null && hex.test(acc)) {
          document.documentElement.style.setProperty('--accent', '#' + acc);
          document.documentElement.style.setProperty('--live', '#' + acc);
        }
        var fg = qs.get('accentfg');
        if (fg !== null && hex.test(fg)) {
          document.documentElement.style.setProperty('--accent-fg', '#' + fg);
        }
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
